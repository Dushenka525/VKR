[project]
name = "vkr"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2",
    "python-dotenv>=1.1.0",
    "wandb>=0.19.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
fixable = ["I", "E", "W"]

ignore = [
    "B904",  # Поднятие ошибок в except
    "B008",  # Depends
    "E712",  # Использование == False
]
